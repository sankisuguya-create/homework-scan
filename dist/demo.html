<!DOCTYPE html>
<!-- このファイルは src/ から build.py が作る。
     直すのは src/ のほう。ここを直しても次のビルドで消える。 -->
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宿題チェック</title>
<style>
/* ==================================================================
   見た目の決まり
   ・フラット：影・グラデーション・半透明を使わない。面は単色で塗る
   ・強いコントラスト：文字と背景の比は 7:1 以上（WCAG AAA）
   ・色だけで区別しない：状態は「アイコン＋文字（または形）＋色」で示す
   ・赤と緑の組み合わせを使わない。濃い青・黄・黒・白で組む
   ・文字は大きく。押せるものは高さ 56px 以上
================================================================== */
:root{
  --ink:#000;          /* 文字・罫線 */
  --paper:#fff;        /* 背景 */
  --soft:#EDEDED;      /* 見出し・押す前の面（黒文字 17:1） */
  --done:#0033A0;      /* 出した（白文字 11:1） */
  --on-done:#fff;
  --warn:#FFC20E;      /* 注意（黒文字 13:1） */
  --sub:#333;          /* 補足の文字（白地 12.6:1） */
  --line:3px solid var(--ink);
  --thin:2px solid var(--ink);
  --r:10px;
  --f:"BIZ UDPGothic","BIZ UDゴシック","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--f)}
body{font-size:20px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.ic{width:1.2em;height:1.2em;flex:none;vertical-align:-0.22em}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── ボタン ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:8px 22px;
  border:var(--line);border-radius:var(--r);background:var(--paper);font-weight:700;font-size:22px;white-space:nowrap}
.btn:focus-visible,.cell:focus-visible,.key:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:5px solid var(--warn);outline-offset:2px}
.btn.primary{background:var(--done);color:var(--on-done);border-color:var(--done)}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.warn{background:var(--warn)}
.btn.small{min-height:44px;font-size:18px;padding:4px 14px;border-width:2px}
.btn:disabled{opacity:1;background:var(--soft);color:var(--sub);border-style:dashed;cursor:default}
.btn.big{min-height:88px;font-size:32px;padding:12px 40px}

/* ================= 係の画面 ================= */
.helper{height:100vh;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;overflow:hidden}
.hbar{display:flex;align-items:center;gap:16px;padding:8px 16px;border-bottom:var(--line);min-height:72px}
.hbar .date{font-size:34px;font-weight:800;letter-spacing:.02em}
.hbar .title{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:700}
.hbar .grow{flex:1}
.net{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:700;padding:6px 12px;border-radius:var(--r)}
.net .ic{width:32px;height:32px}
.net.off{background:var(--warn)}
.tbtn{min-height:56px;font-size:20px}

.sumbar{display:flex;align-items:center;gap:16px;padding:8px 16px;border-bottom:var(--thin);flex-wrap:wrap}
.sum{display:flex;gap:12px;flex-wrap:wrap;flex:1}
.chip .fg{font-size:20px;padding:0 8px;border:2px solid var(--ink);border-radius:6px;background:var(--warn);color:var(--ink)}
.chip .dg{font-size:20px;padding:0 8px;border:2px solid var(--ink);border-radius:6px;background:var(--paper);color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.chip .dg .gm{width:18px;height:18px}
.legend{display:flex;align-items:center;gap:4px;font-size:18px;font-weight:700}
.legend .lg{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--ink);font-size:22px;font-weight:800;border-radius:4px}
.legend .arr{font-size:16px}
.gm{width:1.05em;height:1.05em;display:block}
.chip{display:flex;align-items:center;gap:8px;padding:4px 16px;border:var(--thin);border-radius:999px;font-size:22px;font-weight:700}
.chip .ic{width:30px;height:30px}
.chip .left{font-size:26px}
.chip.all{background:var(--done);color:var(--on-done);border-color:var(--done)}

.panes{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:10px 16px 12px;min-height:0}
.pane{display:grid;min-height:0;border:var(--line);border-radius:var(--r);overflow:hidden}
.pane .row{display:grid;grid-template-columns:var(--cols);border-top:var(--thin);min-height:0}
.pane .row:first-child{border-top:0}
.pane .head{background:var(--ink);color:var(--paper)}
.pane .head > div{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:clamp(14px,1.4vw,20px);padding:4px;text-align:center;line-height:1.15}
.pane .head .ic{width:1.5em;height:1.5em}
.pane .who{display:flex;align-items:center;gap:10px;padding:0 10px;min-width:0}
.pane .no{font-size:clamp(20px,2.3vh + .6vw,34px);font-weight:800;min-width:1.6em;text-align:right;font-variant-numeric:tabular-nums}
.pane .nm{font-size:clamp(16px,1.8vh + .5vw,26px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* マス。状態は「文字（○休忘△）＋色」で示す。色だけでは区別させない */
.cell{display:flex;align-items:center;justify-content:center;border:0;border-left:var(--thin);background:var(--paper);
  padding:0;min-height:0;font-weight:800;color:var(--ink);font-size:clamp(20px,3.6vh,40px);line-height:1}
.cell .g{display:block}
.s-on{background:var(--done);color:var(--on-done)}
.s-rest{background:var(--soft);color:var(--ink)}
.s-forgot{background:var(--warn);color:var(--ink)}
.s-doing{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 4px var(--ink)}
.legend .s-doing{box-shadow:none;border-width:3px}
.cell.flash{animation:flash .45s}
@keyframes flash{0%{outline:6px solid var(--ink);outline-offset:-8px}100%{outline:0 solid var(--ink);outline-offset:-8px}}
.row.empty .who,.row.empty .cell{background:var(--paper);cursor:default}

.none{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:40px;font-weight:800}
.none p{font-size:24px;margin:0}
.none .ic{width:96px;height:96px}

/* ── 全画面の外・終わったあと ── */
.cover{position:fixed;inset:0;z-index:50;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:28px;text-align:center;padding:24px}
.cover .ic.hero{width:120px;height:120px}
.cover h1{font-size:56px;margin:0;line-height:1.3}
.cover p{font-size:26px;margin:0;max-width:34em}
.cover .btn{border-color:var(--paper)}
.cover .btn:not(.primary):not(.warn){background:var(--ink);color:var(--paper)}
.cover .row2{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}

/* ── ダイアログ（とりけし・暗証番号） ── */
.dlg{position:fixed;inset:0;z-index:60;background:var(--ink);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg.light{background:rgba(0,0,0,.72)}
.box{background:var(--paper);border:var(--line);border-radius:14px;padding:28px 32px;max-width:720px;width:100%;
  display:flex;flex-direction:column;gap:22px;align-items:center;text-align:center}
.box h2{margin:0;font-size:34px;line-height:1.35}
.box .who2{font-size:40px;font-weight:800}
.box .item2{display:flex;align-items:center;gap:10px;font-size:32px;font-weight:800}
.box .item2 .ic{width:48px;height:48px}
.box .acts{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.pinshow{display:flex;gap:14px;justify-content:center;min-height:40px}
.pinshow i{width:28px;height:28px;border:3px solid var(--ink);border-radius:50%}
.pinshow i.f{background:var(--ink)}
.pinmsg{font-size:22px;font-weight:700;min-height:1.5em}
.pinmsg.ng{background:var(--warn);padding:2px 12px;border-radius:6px}
.keys{display:grid;grid-template-columns:repeat(3,96px);gap:12px}
.key{height:80px;border:var(--line);border-radius:var(--r);background:var(--paper);font-size:36px;font-weight:800;display:flex;align-items:center;justify-content:center}
.key:active{background:var(--ink);color:var(--paper)}
.key .ic{width:36px;height:36px}
.menu{display:flex;flex-direction:column;gap:14px;width:100%}
.menu .btn{justify-content:flex-start;min-height:72px;font-size:26px}
.menu .btn .ic{width:36px;height:36px}

/* ================= 先生の画面 ================= */
.teacher{min-height:100vh;display:flex;flex-direction:column}
.tbar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:var(--line);flex-wrap:wrap;position:sticky;top:0;background:var(--paper);z-index:5}
.tbar h1{margin:0;font-size:26px;display:flex;align-items:center;gap:10px}
.tbar .grow{flex:1}
.tabs{display:flex;gap:0;border-bottom:var(--line);overflow-x:auto}
.tab{display:flex;align-items:center;gap:10px;padding:12px 22px;border:0;border-right:var(--thin);background:var(--paper);font-size:22px;font-weight:700;min-height:64px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tab .ic{width:28px;height:28px}
.tbody{padding:20px 20px 60px;display:flex;flex-direction:column;gap:26px;max-width:1500px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec h2{margin:0;font-size:26px;display:flex;align-items:center;gap:10px;border-bottom:var(--thin);padding-bottom:4px}
.sec h2 .ic{width:30px;height:30px}
.note{font-size:18px;color:var(--sub);margin:0}
.line{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.daynav{display:flex;align-items:center;gap:10px}
.daynav .d{font-size:28px;font-weight:800;min-width:9em;text-align:center}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.slot{display:flex;align-items:center;gap:10px;border:var(--thin);border-radius:var(--r);padding:8px 10px;min-height:64px}
.slot.on{border:var(--line);background:var(--soft)}
.slot input[type=checkbox]{width:32px;height:32px;accent-color:var(--done);flex:none}
.slot .ic{width:34px;height:34px}
.slot input[type=text]{flex:1;min-width:0;border:var(--thin);border-radius:6px;padding:6px 8px;font-size:20px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pick{min-width:64px;min-height:52px;border:var(--thin);border-radius:var(--r);background:var(--paper);font-weight:800;font-size:20px;display:inline-flex;align-items:center;gap:6px;padding:4px 12px}
.pick[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.pick .ic{width:24px;height:24px}
.field{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:18px}
.field input,.field select,.tbl input,.tbl select{border:var(--thin);border-radius:6px;padding:8px 10px;font-size:20px;background:var(--paper);min-height:48px}
textarea{border:var(--thin);border-radius:6px;padding:10px;font-size:18px;width:100%;min-height:150px}

.tbl{border-collapse:collapse;font-size:20px}
.tbl th,.tbl td{border:var(--thin);padding:6px 10px;text-align:left;vertical-align:middle}
.tbl thead th{background:var(--ink);color:var(--paper);position:sticky;top:76px;z-index:2}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.flag td{background:#FFF3C4}
.tbl .mk{display:inline-flex;align-items:center;gap:6px;font-weight:800;padding:2px 10px;border-radius:6px}
.tbl .mk.flag{background:var(--warn)}
.bar{display:inline-block;width:120px;height:18px;border:2px solid var(--ink);vertical-align:middle;margin-right:8px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--done)}
.bar b{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink)}
.mat .c{min-width:112px;height:60px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:26px;width:100%;line-height:1}
.mat .c.s-none{background:var(--paper)}
.mat .c small{font-size:14px;font-weight:700}
.mat td.cellw{padding:0}
.mat .c.ex{background:var(--soft);font-size:20px;border:2px dashed var(--ink)}
.mat .c .ic{width:26px;height:26px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:14px 26px;border-radius:var(--r);font-size:22px;font-weight:700;z-index:80;display:flex;gap:10px;align-items:center}
.toast.ng{background:var(--warn);color:var(--ink)}
.empty-msg{border:3px dashed var(--ink);border-radius:var(--r);padding:20px;font-size:22px;font-weight:700}

/* ================= 最初の画面（係） ================= */
.start{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center}
.start h1{font-size:52px;margin:0;display:flex;align-items:center;gap:18px}
.start h1 .ic{width:72px;height:72px}
.start p{font-size:24px;margin:0}
</style>

<script>
var BOOT = {view: /teacher/.test(location.hash) ? "teacher" : "helper", url: "", demo: true};

<script>
/* ==================================================================
   Domain.gs — 宿題チェックの決まりごと。副作用なし。

   シートも Apps Script の API も触らない。だから同じファイルを
     ・Apps Script（Api.gs から呼ぶ）
     ・デモ版（dist/demo.html に差し込む）
     ・手元の検査（node tests/domain.test.js）
   の3か所で使う。決まりを変えるときはここだけを直す。

   ■ 日付と時刻
       日付は "2026-09-23"、時刻は "2026-09-23 08:12:05"（日本時間）の文字列で持つ。
       日本は夏時間が無いので、UTC に 9 時間足すだけで日本時間になる。

   ■ 1マスの状態（係がタップするたびに次へ進む）
       空白 → ○提出(on) → 休(rest) → 忘(forgot) → △やっている(doing) → 空白
       「その日・その子・その枠」の記録を時刻順に並べ、**最後の操作**がそのマスの状態。
       記録は消さずに足すだけ。空白に戻すのも「空白(off)」という記録を足す。
       集計では ○ と 休 を「提出」、忘・△・空白を「未提出」として数える。
================================================================== */
var Domain = (function(){

  var JST = 9 * 3600 * 1000;
  var SLOTS = 9;   /* 枠は 1〜9。0 は「休み（提出物なし）」の印 */
  var STATES = ["", "on", "rest", "forgot", "doing"];
  var NEXT = {"":"on", on:"rest", rest:"forgot", forgot:"doing", doing:""};
  var COUNTS = {on:true, rest:true};   /* 提出として数える状態 */
  function isState(s){ return STATES.indexOf(s) >= 0; }
  function nextState(s){ return NEXT[s || ""] == null ? "on" : NEXT[s || ""]; }
  function counts(s){ return !!COUNTS[s]; }

  function pad(n){ return (n < 10 ? "0" : "") + n; }

  function jstParts(ms){
    var d = new Date(ms + JST);
    return {y:d.getUTCFullYear(), mo:d.getUTCMonth() + 1, d:d.getUTCDate(),
            h:d.getUTCHours(), mi:d.getUTCMinutes(), s:d.getUTCSeconds(), wd:d.getUTCDay()};
  }
  function jstDate(ms){
    var p = jstParts(ms);
    return p.y + "-" + pad(p.mo) + "-" + pad(p.d);
  }
  function jstStamp(ms){
    var p = jstParts(ms);
    return jstDate(ms) + " " + pad(p.h) + ":" + pad(p.mi) + ":" + pad(p.s);
  }
  /* "2026-09-23 08:12:05" → その日の 0 時からの分（8*60+12）。読めなければ null */
  function stampMinutes(stamp){
    var m = /(\d{1,2}):(\d{2})(?::\d{2})?$/.exec(String(stamp || ""));
    return m ? Number(m[1]) * 60 + Number(m[2]) : null;
  }
  function hhmm(min){
    if(min == null || !isFinite(min)) return "";
    min = Math.round(min);
    return Math.floor(min / 60) + ":" + pad(min % 60);
  }
  function isDate(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s || "")); }
  /* シートから読むと Date になっていることがある。日本時間の文字列に寄せる */
  function asDate(v){
    if(v instanceof Date) return jstDate(v.getTime());
    var s = String(v == null ? "" : v).trim();
    var m = /^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/.exec(s);
    return m ? m[1] + "-" + pad(Number(m[2])) + "-" + pad(Number(m[3])) : "";
  }
  function asStamp(v){
    if(v instanceof Date) return jstStamp(v.getTime());
    return String(v == null ? "" : v).trim();
  }
  function addDays(date, n){
    var p = date.split("-").map(Number);
    var t = Date.UTC(p[0], p[1] - 1, p[2]) + n * 86400000;
    var d = new Date(t);
    return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate());
  }
  function weekday(date){
    var p = date.split("-").map(Number);
    return "日月火水木金土".charAt(new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay());
  }

  function toInt(v){
    var s = String(v == null ? "" : v);
    if(s.normalize) s = s.normalize("NFKC");
    s = s.trim();
    return /^\d+$/.test(s) ? Number(s) : null;
  }

  /* ── 免除・欠席 ─────────────────────────── */
  function isExempt(exemptions, date, no, slot){
    for(var i = 0; i < exemptions.length; i++){
      var x = exemptions[i];
      if(x.no !== no) continue;
      if(x.slot && x.slot !== slot) continue;
      if(x.from && date < x.from) continue;
      if(x.to && date > x.to) continue;
      return true;
    }
    return false;
  }
  function absentSet(absences, date){
    var s = {};
    absences.forEach(function(a){ if(a.date === date) s[a.no] = true; });
    return s;
  }

  /* ── 1日の表 ───────────────────────────────
     events: [{id,date,no,slot,op:"on"|"rest"|"forgot"|"doing"|"off",at:"stamp",via,seq}]
     戻り値 marks["番号:枠"] = {state, at, via}（記録があるマスだけ。空白に戻したマスは state:""）
     at・via は、いまの状態にした記録のもの */
  function finalMarks(events, date){
    var list = events.filter(function(e){ return e.date === date; });
    list.sort(function(a, b){
      return a.at < b.at ? -1 : a.at > b.at ? 1 : (a.seq || 0) - (b.seq || 0);
    });
    var marks = {};
    list.forEach(function(e){
      var k = e.no + ":" + e.slot;
      var s = e.op === "off" ? "" : e.op;
      if(s && !isState(s)) return;
      marks[k] = {state:s, at:e.at, via:e.via};
    });
    return marks;
  }
  /* 記録が無いマスは、先生が欠席にした子なら「休」。空白なら null */
  function cellState(marks, abs, no, slot){
    var k = no + ":" + slot;
    if(marks[k]) return marks[k].state ? marks[k] : null;
    return abs[no] ? {state:"rest", at:"", via:"absent"} : null;
  }

  /* 係の画面に渡す形。
     cells["番号:枠"] = "on"|"rest"|"forgot"|"doing"（空白は入れない）
     excused は免除のマス。係の画面では ○ と同じ見た目にし、押しても変えない。
     免除の理由（メモ）は渡さない。 */
  function dayView(opts){
    var date = opts.date, items = opts.items, roster = opts.roster;
    var marks = finalMarks(opts.events, date);
    var abs = absentSet(opts.absences, date);
    var cells = {}, excused = {};
    roster.forEach(function(st){
      items.forEach(function(it){
        var k = st.no + ":" + it.slot;
        if(isExempt(opts.exemptions, date, st.no, it.slot)){ excused[k] = 1; return; }
        var m = cellState(marks, abs, st.no, it.slot);
        if(m) cells[k] = m.state;
      });
    });
    return {cells:cells, excused:excused};
  }

  /* 先生の画面に渡す形。理由（欠席・免除）と入力の方法まで持つ */
  function dayDetail(opts){
    var date = opts.date;
    var marks = finalMarks(opts.events, date);
    var abs = absentSet(opts.absences, date);
    var cells = {};
    opts.roster.forEach(function(st){
      opts.items.forEach(function(it){
        var m = cellState(marks, abs, st.no, it.slot);
        cells[st.no + ":" + it.slot] = {
          state: m ? m.state : "", at: m && m.at ? hhmm(stampMinutes(m.at)) : "", via: m ? m.via : "",
          absent: !!abs[st.no],
          exempt: isExempt(opts.exemptions, date, st.no, it.slot)
        };
      });
    });
    return cells;
  }

  /* ── 集計 ─────────────────────────────────
     days: {"2026-09-23":[{slot,name}], …}  提出物が1つ以上ある日だけが数える日
     返すのは児童ごとの
       required  出すべき数（免除を除く。休みの日も数える）
       submitted 提出として数えた数（○と休）
       rest / forgot / doing  休・忘・△ の数
       rate      submitted / required（required が 0 なら null）
       avgMin / medMin  出した時刻の平均・中央値（先生が後から付けた印は除く）
       streak    いちばん新しい日から数えて、続けて出し忘れた日の数
       flag      rate が目安より低い、または streak が目安以上 */
  function stats(opts){
    var from = opts.from || "", to = opts.to || "9999-99-99";
    var rateMin = opts.rateMin == null ? 0.8 : opts.rateMin;
    var streakMin = opts.streakMin == null ? 3 : opts.streakMin;
    var dates = Object.keys(opts.days).filter(function(d){
      return d >= from && d <= to && opts.days[d].length > 0;
    }).sort();

    var byDate = {};
    opts.events.forEach(function(e){
      if(!byDate[e.date]) byDate[e.date] = [];
      byDate[e.date].push(e);
    });
    var marksByDate = {}, absByDate = {};
    dates.forEach(function(d){
      marksByDate[d] = finalMarks(byDate[d] || [], d);
      absByDate[d] = absentSet(opts.absences, d);
    });

    var itemNames = [];
    var students = opts.roster.map(function(st){
      var req = 0, sub = 0, mins = [], perItem = {}, dayMiss = [];
      var n = {rest:0, forgot:0, doing:0};
      dates.forEach(function(d){
        var dayReq = 0, daySub = 0;
        opts.days[d].forEach(function(it){
          if(isExempt(opts.exemptions, d, st.no, it.slot)) return;
          var m = cellState(marksByDate[d], absByDate[d], st.no, it.slot);
          var s = m ? m.state : "";
          dayReq++; req++;
          if(!perItem[it.name]){ perItem[it.name] = {req:0, sub:0}; if(itemNames.indexOf(it.name) < 0) itemNames.push(it.name); }
          perItem[it.name].req++;
          if(s in n) n[s]++;
          if(counts(s)){
            daySub++; sub++; perItem[it.name].sub++;
            if(s === "on" && m.via !== "teacher"){
              var mm = stampMinutes(m.at);
              if(mm != null) mins.push(mm);
            }
          }
        });
        if(dayReq > 0) dayMiss.push({date:d, missed: daySub < dayReq});
      });
      var streak = 0;
      for(var i = dayMiss.length - 1; i >= 0 && dayMiss[i].missed; i--) streak++;
      var rate = req ? sub / req : null;
      var avg = mins.length ? mins.reduce(function(a, b){ return a + b; }, 0) / mins.length : null;
      var sorted = mins.slice().sort(function(a, b){ return a - b; });
      var med = null;
      if(sorted.length){
        var h = Math.floor(sorted.length / 2);
        med = sorted.length % 2 ? sorted[h] : (sorted[h - 1] + sorted[h]) / 2;
      }
      var lowRate = rate != null && rate < rateMin;
      var longStreak = streak >= streakMin;
      return {no:st.no, name:st.name, required:req, submitted:sub, rate:rate,
              rest:n.rest, forgot:n.forgot, doing:n.doing,
              avgMin:avg, medMin:med, avg:hhmm(avg), med:hhmm(med),
              streak:streak, perItem:perItem,
              lowRate:lowRate, longStreak:longStreak, flag: lowRate || longStreak};
    });
    return {dates:dates, itemNames:itemNames, students:students,
            rateMin:rateMin, streakMin:streakMin};
  }

  /* ── 名簿の貼り付け ───────────────────────
     スプレッドシートから範囲をコピーした文字（タブ区切り）を読む。
     1行ごとに「数字だけのマス＝番号」「最初の数字でないマス＝氏名」。
     番号が無い行ばかりなら、上から 1, 2, 3… を振る。
     氏名が無い行（見出し・空行）は捨てる。 */
  var HEAD = /^(番号|出席番号|氏名|名前|なまえ|児童名|No\.?)$/i;
  function parseRoster(text){
    var rows = [];
    String(text || "").split(/\r?\n/).forEach(function(line){
      if(!line.trim()) return;
      var cells = line.split(line.indexOf("\t") >= 0 ? "\t" : ",").map(function(c){
        c = c.trim(); return c.normalize ? c.normalize("NFKC") : c;
      });
      var no = null, name = "";
      cells.forEach(function(c){
        if(!c) return;
        var n = toInt(c);
        if(n != null){ if(no == null) no = n; }
        else if(!name && !HEAD.test(c)) name = c.replace(/\s+/g, " ");
      });
      if(name) rows.push({no:no, name:name});
    });
    var numbered = rows.filter(function(r){ return r.no != null && r.no > 0; }).length;
    if(numbered < rows.length){
      rows.forEach(function(r, i){ r.no = i + 1; });
    }
    var seen = {}, out = [];
    rows.forEach(function(r){
      if(r.no < 1 || r.no > 99 || seen[r.no]) return;
      seen[r.no] = true; out.push(r);
    });
    out.sort(function(a, b){ return a.no - b.no; });
    return out;
  }

  return {
    SLOTS:SLOTS, STATES:STATES, isState:isState, nextState:nextState, counts:counts,
    pad:pad, jstDate:jstDate, jstStamp:jstStamp, jstParts:jstParts,
    stampMinutes:stampMinutes, hhmm:hhmm, isDate:isDate, asDate:asDate, asStamp:asStamp,
    addDays:addDays, weekday:weekday, toInt:toInt,
    isExempt:isExempt, finalMarks:finalMarks, dayView:dayView, dayDetail:dayDetail,
    stats:stats, parseRoster:parseRoster
  };
})();
</script>
<script>
/* ==================================================================
   Api.gs — 画面から呼ぶ口（api…）。

   ■ 3段の関門
       1. すべての api… は1行目で Gate.check()（guard）を呼ぶ。
          教職員のアカウントでなければ何も返さない。
       2. 先生の口（名簿・免除・分析など）は、さらに暗証番号で得た
          token を確かめる（teacher）。係の画面は教師のアカウントで
          開いた PC で動くので、1 だけでは係の児童も先生の口を呼べてしまう。
       3. スプレッドシートそのものは児童に共有しない。

   ■ シートやキャッシュは P.… 経由で触る（Platform.gs）。
       ここは Apps Script の API を直接呼ばない。デモ版と検査で
       同じファイルをそのまま動かすため。
================================================================== */

var TABLES = {
  "名簿":     ["番号", "氏名"],
  "品目":     ["枠", "名前", "アイコン", "いつも出す"],
  "日の品目": ["日付", "枠", "名前"],
  "提出記録": ["記録ID", "日付", "番号", "枠", "操作", "時刻", "入力", "端末", "受信"],
  "欠席":     ["日付", "番号"],
  "免除":     ["開始日", "終了日", "番号", "枠", "メモ"],
  "操作記録": ["時刻", "種類", "内容", "利用者"],
  "設定":     ["項目", "値"]
};
var ICONS = ["book", "calc", "note", "pencil", "paper", "star", "music", "bag", "abc"];
var DEFAULT_ROWS = {
  "品目": [
    ["1", "漢字ドリル", "book",   "○"],
    ["2", "計算ドリル", "calc",   "○"],
    ["3", "連絡帳",     "note",   "○"],
    ["4", "", "pencil", ""], ["5", "", "paper", ""], ["6", "", "star",  ""],
    ["7", "", "music",  ""], ["8", "", "bag",   ""], ["9", "", "abc",   ""]
  ],
  "設定": [
    ["提出率の目安（%）", "80"],
    ["続けて出ていない日の目安", "3"],
    ["係の画面に氏名を出す", "出す"],
    ["集計の開始日", ""]
  ]
};
var OP  = {on:"提出", rest:"休み", forgot:"忘れた", doing:"やっている", off:"空白"};
var VIA = {tap:"タップ", teacher:"先生"};
var TOKEN_SEC = 6 * 3600;
var TAIL = 5000;

function invert(o){ var r = {}; Object.keys(o).forEach(function(k){ r[o[k]] = k; }); return r; }
var OP_R = invert(OP), VIA_R = invert(VIA);
OP_R["取消"] = "off";

/* ── 関門 ───────────────────────────────── */
function guard(){ return P.email(); }
function teacher(token){
  var email = guard();
  var t = String(token || "");
  if(!/^[\w-]{8,64}$/.test(t) || !P.cacheGet("tok:" + t)) throw new Error("LOCKED");
  return email;
}

/* ── 表を読む ─────────────────────────────── */
function readRoster(){
  var out = [], seen = {};
  P.rows("名簿").forEach(function(r){
    var no = Domain.toInt(r[0]), name = String(r[1] || "").trim();
    if(no == null || no < 1 || no > 99 || !name || seen[no]) return;
    seen[no] = true; out.push({no:no, name:name});
  });
  return out.sort(function(a, b){ return a.no - b.no; });
}
function readSlots(){
  var bySlot = {};
  P.rows("品目").forEach(function(r){
    var s = Domain.toInt(r[0]);
    if(s == null || s < 1 || s > Domain.SLOTS) return;
    bySlot[s] = {slot:s, name:String(r[1] || "").trim(),
                 icon: ICONS.indexOf(String(r[2])) >= 0 ? String(r[2]) : ICONS[s - 1],
                 daily: String(r[3] || "").trim() !== ""};
  });
  var out = [];
  for(var s = 1; s <= Domain.SLOTS; s++)
    out.push(bySlot[s] || {slot:s, name:"", icon:ICONS[s - 1], daily:false});
  return out;
}
function readDays(){
  var days = {};
  P.rows("日の品目").forEach(function(r){
    var d = Domain.asDate(r[0]), s = Domain.toInt(r[1]);
    if(!d || s == null) return;
    if(!days[d]) days[d] = [];
    if(s >= 1 && s <= Domain.SLOTS) days[d].push({slot:s, name:String(r[2] || "").trim()});
  });
  Object.keys(days).forEach(function(d){ days[d].sort(function(a, b){ return a.slot - b.slot; }); });
  return days;
}
function toEvent(r, i){
  return {id:String(r[0]), date:Domain.asDate(r[1]), no:Domain.toInt(r[2]), slot:Domain.toInt(r[3]),
          op:OP_R[String(r[4])] || "", at:Domain.asStamp(r[5]), via:VIA_R[String(r[6])] || "tap", seq:i};
}
function readEvents(all){
  var rows = all ? P.rows("提出記録") : P.tail("提出記録", TAIL);
  return rows.map(toEvent).filter(function(e){ return e.date && e.no && e.slot && e.op; });
}
function readAbsences(){
  return P.rows("欠席").map(function(r){ return {date:Domain.asDate(r[0]), no:Domain.toInt(r[1])}; })
    .filter(function(a){ return a.date && a.no; });
}
function readExemptions(){
  return P.rows("免除").map(function(r){
    return {from:Domain.asDate(r[0]), to:Domain.asDate(r[1]), no:Domain.toInt(r[2]),
            slot:Domain.toInt(r[3]) || 0, memo:String(r[4] || "")};
  }).filter(function(x){ return x.no; });
}
function readSettings(){
  var kv = {};
  P.rows("設定").forEach(function(r){ kv[String(r[0]).trim()] = String(r[1] == null ? "" : r[1]).trim(); });
  var rate = Number(kv["提出率の目安（%）"]), streak = Number(kv["続けて出ていない日の目安"]);
  return {
    ratePct: isFinite(rate) && rate > 0 && rate <= 100 ? rate : 80,
    streakMin: isFinite(streak) && streak >= 1 ? Math.round(streak) : 3,
    showNames: kv["係の画面に氏名を出す"] !== "出さない",
    from: Domain.asDate(kv["集計の開始日"] || "")
  };
}

function today(){ return Domain.jstDate(P.now()); }

/* その日の品目。無ければ「いつも出す」から作る（係の画面を開いた日＝数える日） */
function itemsFor(date, create){
  var days = readDays(), slots = readSlots();
  var list = days[date];
  if(!list && create){
    list = slots.filter(function(s){ return s.daily && s.name; })
                .map(function(s){ return {slot:s.slot, name:s.name}; });
    var rows = list.length ? list.map(function(it){ return [date, it.slot, it.name]; })
                           : [[date, 0, "提出物なし"]];
    P.lock(function(){
      if(!readDays()[date]) P.append("日の品目", rows);
    });
  }
  var icon = {};
  slots.forEach(function(s){ icon[s.slot] = s.icon; });
  return list ? list.map(function(it){ return {slot:it.slot, name:it.name, icon:icon[it.slot]}; }) : null;
}

/* ── 係の画面 ─────────────────────────────── */
function helperState(){
  var date = today();
  var items = itemsFor(date, true) || [];
  var roster = readRoster();
  var v = Domain.dayView({date:date, items:items, roster:roster, events:readEvents(false),
                          absences:readAbsences(), exemptions:readExemptions()});
  var st = readSettings();
  return {date:date, wd:Domain.weekday(date), items:items,
          roster: roster.map(function(s){ return {no:s.no, name: st.showNames ? s.name : ""}; }),
          cells:v.cells, excused:v.excused, hasPin: !!P.prop("PIN_HASH"), now:P.now()};
}
function apiToday(){
  guard();
  return helperState();
}

/* マスの状態を変える。events は端末に貯めた分をまとめて送ってくる。
   op は「この状態にする」（on/rest/forgot/doing/off）。「次へ進める」ではないので、
   送り直しても、2台が同じマスを押しても、状態がとびとびに進んでしまうことはない。
   同じ記録IDは2度書かない（通信が切れて送り直しても重ならない）。
   きょう以外の日を直すのは先生だけ（token が要る）。過ぎた日の直しはその日の 23:59:59 に置き、
   その日のどの記録よりも後（＝いまの状態）にする。 */
function apiMark(events, token){
  var email = guard();
  var isTeacher = false;
  if(token){ try{ teacher(token); isTeacher = true; }catch(err){ isTeacher = false; } }
  var now = P.now(), date0 = today(), recv = Domain.jstStamp(now);
  var roster = {}; readRoster().forEach(function(s){ roster[s.no] = true; });
  var days = readDays();
  var list = Array.isArray(events) ? events.slice(0, 500) : [];
  var processed = [], rows = [];
  P.lock(function(){
    var seen = {};
    P.tail("提出記録", TAIL).forEach(function(r){ seen[String(r[0])] = true; });
    list.forEach(function(e){
      if(!e || typeof e !== "object") return;
      var id = String(e.id || "");
      if(!/^[\w-]{6,40}$/.test(id)) return;
      processed.push(id);
      if(seen[id]) return;
      var date = Domain.asDate(e.date);
      if(!date || date > date0 || date < Domain.addDays(date0, -7)) return;
      if(date !== date0 && !isTeacher) return;
      var no = Domain.toInt(e.no), slot = Domain.toInt(e.slot);
      if(!roster[no]) return;
      var items = days[date];
      if(!items || !items.some(function(it){ return it.slot === slot; })) return;
      if(!OP[e.op]) return;
      var via = VIA[e.via] ? e.via : "tap";
      if(via === "teacher" && !isTeacher) via = "tap";
      var at = Number(e.at);
      if(!isFinite(at) || at > now + 5 * 60000 || at < now - 8 * 86400000) at = now;
      var stamp = date === date0 ? Domain.jstStamp(at) : date + " 23:59:59";
      seen[id] = true;
      rows.push([id, date, no, slot, OP[e.op], stamp, VIA[via],
                 String(e.dev || "").slice(0, 20), recv]);
    });
    P.append("提出記録", rows);
  });
  void email;
  return {processed:processed, state:helperState()};
}

var LOG_KINDS = {
  "start":"係の画面を始めた", "leave":"全画面が解除された", "resume":"全画面に戻した",
  "finish":"係の画面を終えた", "unlock":"先生の画面を開いた", "unlock-ng":"暗証番号の間違い"
};
function log(kind, detail, email){
  P.append("操作記録", [[Domain.jstStamp(P.now()), LOG_KINDS[kind] || kind,
                         String(detail || "").slice(0, 200), email || ""]]);
}
function apiLog(kind, detail){
  var email = guard();
  if(!LOG_KINDS[kind] || kind === "unlock" || kind === "unlock-ng") return false;
  log(kind, detail, email);
  return true;
}

/* ── 暗証番号 ─────────────────────────────── */
function pinHash(pin){ return P.hash((P.prop("PIN_SALT") || "") + ":" + pin); }
function validPin(pin){ return /^\d{4,8}$/.test(String(pin || "")); }
function issueToken(email){
  var t = P.uuid();
  P.cachePut("tok:" + t, email, TOKEN_SEC);
  return t;
}
function apiUnlock(pin){
  var email = guard();
  var fails = Number(P.cacheGet("pin-fail") || 0);
  if(fails >= 5) return {ok:false, wait:true};
  if(!P.prop("PIN_HASH")) return {ok:false, needSetup:true};
  if(!validPin(pin) || pinHash(String(pin)) !== P.prop("PIN_HASH")){
    P.cachePut("pin-fail", fails + 1, 300);
    log("unlock-ng", "", email);
    return {ok:false, left: Math.max(0, 4 - fails)};
  }
  P.cacheDel("pin-fail");
  log("unlock", "", email);
  return {ok:true, token:issueToken(email)};
}
/* 初めての1回だけは token なしで決められる。2回目からは先生の token が要る。 */
function apiSetPin(token, pin){
  var email = guard();
  if(P.prop("PIN_HASH")) teacher(token);
  if(!validPin(pin)) throw new Error("暗証番号は4〜8けたの数字にしてください。");
  P.setProp("PIN_SALT", P.uuid());
  P.setProp("PIN_HASH", pinHash(String(pin)));
  return {ok:true, token: token && P.cacheGet("tok:" + token) ? token : issueToken(email)};
}
function apiLock(token){
  guard();
  if(token) P.cacheDel("tok:" + String(token));
  return true;
}

/* ── 先生の画面 ───────────────────────────── */
function apiTeacherDay(token, date){
  teacher(token);
  var d0 = today();
  date = Domain.asDate(date) || d0;
  var items = itemsFor(date, date === d0);
  var roster = readRoster(), absences = readAbsences();
  var cells = Domain.dayDetail({date:date, items:items || [], roster:roster,
                                events:readEvents(date < Domain.addDays(d0, -14)),
                                absences:absences, exemptions:readExemptions()});
  return {date:date, wd:Domain.weekday(date), today:d0, hasDay: !!items,
          items:items || [], slots:readSlots(), roster:roster, cells:cells,
          absent: absences.filter(function(a){ return a.date === date; }).map(function(a){ return a.no; })};
}
function apiSaveDay(token, date, items){
  teacher(token);
  date = Domain.asDate(date);
  if(!date) throw new Error("日付が読めません。");
  var seen = {}, rows = [];
  (items || []).forEach(function(it){
    var s = Domain.toInt(it && it.slot), name = String(it && it.name || "").trim().slice(0, 20);
    if(s == null || s < 1 || s > Domain.SLOTS || !name || seen[s]) return;
    seen[s] = true; rows.push([date, s, name]);
  });
  if(!rows.length) rows.push([date, 0, "提出物なし"]);
  P.lock(function(){
    var keep = P.rows("日の品目").filter(function(r){ return Domain.asDate(r[0]) !== date; });
    P.replace("日の品目", keep.concat(rows));
  });
  return apiTeacherDay(token, date);
}
function apiSetAbsent(token, date, nos){
  teacher(token);
  date = Domain.asDate(date);
  if(!date) throw new Error("日付が読めません。");
  var add = [], seen = {};
  (nos || []).forEach(function(n){
    n = Domain.toInt(n);
    if(n && !seen[n]){ seen[n] = true; add.push([date, n]); }
  });
  P.lock(function(){
    var keep = P.rows("欠席").filter(function(r){ return Domain.asDate(r[0]) !== date; });
    P.replace("欠席", keep.concat(add));
  });
  return apiTeacherDay(token, date);
}
function apiSetup(token){
  teacher(token);
  return {roster:readRoster(), slots:readSlots(), exemptions:readExemptions(),
          settings:readSettings(), icons:ICONS, url:P.url(), today:today()};
}
function apiSaveRoster(token, list){
  teacher(token);
  var seen = {}, rows = [];
  (list || []).forEach(function(s){
    var no = Domain.toInt(s && s.no), name = String(s && s.name || "").trim().slice(0, 40);
    if(no == null || no < 1 || no > 99 || !name || seen[no]) return;
    seen[no] = true; rows.push([no, name]);
  });
  rows.sort(function(a, b){ return a[0] - b[0]; });
  P.lock(function(){ P.replace("名簿", rows); });
  return apiSetup(token);
}
function apiSaveSlots(token, slots){
  teacher(token);
  var by = {};
  (slots || []).forEach(function(s){
    var n = Domain.toInt(s && s.slot);
    if(n != null && n >= 1 && n <= Domain.SLOTS) by[n] = s;
  });
  var rows = [];
  for(var n = 1; n <= Domain.SLOTS; n++){
    var s = by[n] || {};
    var icon = ICONS.indexOf(String(s.icon)) >= 0 ? String(s.icon) : ICONS[n - 1];
    var name = String(s.name || "").trim().slice(0, 20);
    rows.push([n, name, icon, s.daily && name ? "○" : ""]);
  }
  P.lock(function(){ P.replace("品目", rows); });
  return apiSetup(token);
}
function apiSaveExemptions(token, list){
  teacher(token);
  var rows = [];
  (list || []).slice(0, 500).forEach(function(x){
    var no = Domain.toInt(x && x.no);
    if(!no) return;
    var slot = Domain.toInt(x.slot) || 0;
    var from = Domain.asDate(x.from), to = Domain.asDate(x.to);
    if(from && to && to < from){ var t = from; from = to; to = t; }
    rows.push([from, to, no, slot || "", String(x.memo || "").slice(0, 100)]);
  });
  P.lock(function(){ P.replace("免除", rows); });
  return apiSetup(token);
}
function apiSaveSettings(token, s){

<script>
/* デモ版と手元の検査で使う P（Platform.gs の代わり）。
   表は配列のまま持ち、ブラウザでは localStorage に残す。 */
var P = (function(){
  var KEY = "homework-scan/demo-v1";
  var hasLS = (function(){ try{ return typeof localStorage !== "undefined" && !!localStorage; }catch(e){ return false; } })();
  var db = load();
  var offset = 0;

  function fresh(){
    var t = {};
    Object.keys(TABLES).forEach(function(n){
      t[n] = (DEFAULT_ROWS[n] || []).map(function(r){ return r.map(String); });
    });
    return {tables:t, props:{}, cache:{}};
  }
  function load(){
    if(hasLS){
      try{ var s = localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){}
    }
    return fresh();
  }
  function save(){ if(hasLS){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} } }
  function table(n){
    if(!TABLES[n]) throw new Error("知らない表: " + n);
    if(!db.tables[n]) db.tables[n] = [];
    return db.tables[n];
  }
  function copy(rows){ return rows.map(function(r){ return r.slice(); }); }
  function norm(n, row){
    var out = [];
    for(var i = 0; i < TABLES[n].length; i++) out.push(row[i] == null ? "" : String(row[i]));
    return out;
  }

  var api = {
    rows: function(n){ return copy(table(n)); },
    tail: function(n, c){ var t = table(n); return copy(t.slice(Math.max(0, t.length - c))); },
    append: function(n, list){ var t = table(n); list.forEach(function(r){ t.push(norm(n, r)); }); save(); },
    replace: function(n, list){ db.tables[n] = list.map(function(r){ return norm(n, r); }); save(); },
    prop: function(k){ return db.props[k] == null ? null : db.props[k]; },
    setProp: function(k, v){ db.props[k] = String(v); save(); },
    cacheGet: function(k){
      var c = db.cache[k];
      if(!c) return null;
      if(c.until < api.now()){ delete db.cache[k]; save(); return null; }
      return c.v;
    },
    cachePut: function(k, v, sec){ db.cache[k] = {v:String(v), until: api.now() + sec * 1000}; save(); },
    cacheDel: function(k){ delete db.cache[k]; save(); },
    lock: function(fn){ return fn(); },
    now: function(){ return Date.now() + offset; },
    uuid: function(){
      var s = "";
      for(var i = 0; i < 32; i++) s += Math.floor(Math.random() * 16).toString(16);
      return s.slice(0, 8) + "-" + s.slice(8, 12) + "-" + s.slice(12, 16) + "-" + s.slice(16, 20) + "-" + s.slice(20);
    },
    hash: function(s){
      var h1 = 0x811c9dc5, h2 = 0x01000193;
      for(var i = 0; i < s.length; i++){
        h1 = Math.imul(h1 ^ s.charCodeAt(i), 16777619) >>> 0;
        h2 = Math.imul(h2 + s.charCodeAt(i), 2246822519) >>> 0;
      }
      return h1.toString(16) + h2.toString(16);
    },
    url: function(){ return ""; },
    email: function(){ return Gate.check().email; },

    /* 検査とデモのための口。本物の Platform.gs には無い */
    _reset: function(){ db = fresh(); save(); },
    _setNow: function(ms){ offset = ms - Date.now(); },
    _db: function(){ return db; },
    _empty: function(){ return !db.tables["名簿"] || db.tables["名簿"].length === 0; }
  };
  return api;
})();

var Gate = (typeof Gate !== "undefined") ? Gate : {
  check: function(){ return {ok:true, email:"demo@edu.nishi.or.jp"}; }
};
</script>
<script>
/* デモ版の初期データ。名前は架空。暗証番号は 1234。
   過去2週間ぶんの提出記録を作って、分析の画面に中身が出るようにする。 */
function demoSeed(){
  if(!P._empty()) return;
  var names = ["あおき はると", "いしかわ めい", "うえだ そうた", "えんどう ゆい", "おおの れん",
    "かとう ひまり", "きむら ゆうと", "くどう あおい", "けんもち りく", "こばやし さくら",
    "さいとう はやと", "しみず こはる", "すずき たいが", "せきぐち みお", "そのだ いつき",
    "たなか ゆな", "ちば けんた", "つじ りこ", "てらだ かいと", "ながい ひなた",
    "にしだ あかり", "ぬまた こうき", "のむら ことね", "はしもと そら", "ひらの ゆづき",
    "ふじい しょう", "ほんだ まな", "まつもと だいち", "みやざき えま", "むらかみ はる",
    "もりた あんな", "やまだ ゆうま", "よしだ かのん"];
  P.replace("名簿", names.map(function(n, i){ return [i + 1, n]; }));
  P.setProp("PIN_SALT", "demo");
  P.setProp("PIN_HASH", P.hash("demo:1234"));

  var seed = 7;
  function rnd(){ seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  var today = Domain.jstDate(P.now());
  var days = [], ev = [], abs = [];
  var d = today, n = 0;
  while(days.length < 10 && n < 30){
    d = Domain.addDays(d, -1); n++;
    var wd = Domain.weekday(d);
    if(wd === "土" || wd === "日") continue;
    days.push(d);
  }
  days.reverse().forEach(function(date, di){
    var items = [[1, "漢字ドリル"], [2, "計算ドリル"], [3, "連絡帳"]];
    if(di % 3 === 1) items.push([4, "音読カード"]);
    items.forEach(function(it){ P.append("日の品目", [[date, it[0], it[1]]]); });
    names.forEach(function(_, i){
      var no = i + 1;
      if(no === 12 && di === 6){ abs.push([date, no]); return; }
      var weak = no === 7 || no === 23;
      items.forEach(function(it){
        if(no === 15 && it[0] === 2) return;
        var p = weak ? 0.55 : 0.96;
        if(no === 29 && di >= 6) p = 0;
        var base = weak ? 8 * 60 + 25 : 8 * 60 + 5;
        var m = Math.round(base + rnd() * 20 - 5);
        var stamp = date + " 0" + Math.floor(m / 60) + ":" + Domain.pad(m % 60) + ":00";
        var op = "提出";
        if(rnd() > p){
          var r = rnd();
          if(r < 0.2) return;
          op = r < 0.75 ? "忘れた" : "やっている";
        }
        ev.push(["seed-" + date + "-" + no + "-" + it[0], date, no, it[0], op, stamp, "タップ", "demo", stamp]);
      });
    });
  });
  P.append("提出記録", ev);
  P.append("欠席", abs);
  P.append("免除", [[days[0], "", 15, 2, "計算ドリルは別の課題"]]);
  P.replace("設定", DEFAULT_ROWS["設定"].map(function(r){ return r.slice(); }).map(function(r){
    if(r[0] === "集計の開始日") r[1] = days[0];
    return r;
  }));
}
demoSeed();
</script>
<script>
/* デモ版の google.script.run。同じ名前のサーバ関数を少し遅らせて呼ぶ。
   引数と戻り値は JSON を通して、本物と同じく「値だけが渡る」ようにする。
   window.DEMO_OFFLINE = true にすると通信の失敗を真似る。 */
var google = {script: {run: (function(){
  function runner(ok, ng){
    var r = {
      withSuccessHandler: function(f){ return runner(f, ng); },
      withFailureHandler: function(f){ return runner(ok, f); }
    };
    ["apiToday", "apiMark", "apiLog", "apiUnlock", "apiSetPin", "apiLock", "apiTeacherDay",
     "apiSaveDay", "apiSetAbsent", "apiSetup", "apiSaveRoster", "apiSaveSlots",
     "apiSaveExemptions", "apiSaveSettings", "apiStats", "apiLogs"].forEach(function(name){
      r[name] = function(){
        var args = JSON.parse(JSON.stringify(Array.prototype.slice.call(arguments)));
        setTimeout(function(){
          if(window.DEMO_OFFLINE){ if(ng) ng(new Error("NetworkError: デモの通信切れ")); return; }
          var out, err = null;
          try{
            var v = window[name].apply(null, args);
            out = v === undefined ? null : JSON.parse(JSON.stringify(v));
          }
          catch(e){ err = e; }
          if(err){ if(ng) ng(err); }
          else if(ok) ok(out);
        }, 60);
      };
    });
    return r;
  }
  return runner(null, null);
})()}};
</script>

 <label for=\"url\">宿題チェックの URL（Apps Script の「ウェブアプリ」の URL）<\/label>\n    <input id=\"url\" type=\"url\" placeholder=\"https://script.google.com/a/macros/…/exec\">\n    <button id=\"seturl\">この URL を 使う<\/button>\n  <\/div>\n<\/div>\n<iframe id=\"app\" title=\"宿題チェック\" allow=\"autoplay\"><\/iframe>\n<script>\n(function(){\n  var URL_IN_FILE = \"__APP_URL__\";\n  var KEY = \"homework-scan/launcher-url\";\n  var frame = document.getElementById(\"app\"), start = document.getElementById(\"start\");\n  var msg = document.getElementById(\"msg\");\n  var started = false, exiting = false, inner = null;\n\n  function appUrl(){\n    if(/^https?:|^file:/.test(URL_IN_FILE)) return URL_IN_FILE;\n    try{ return localStorage.getItem(KEY) || \"\"; }catch(e){ return \"\"; }\n  }\n  function load(){\n    var u = appUrl();\n    if(!u){ document.getElementById(\"urlbox\").classList.remove(\"hide\"); return; }\n    frame.src = u;\n  }\n  document.getElementById(\"seturl\").onclick = function(){\n    var u = document.getElementById(\"url\").value.trim();\n    if(!/^https:\\/\\/script\\.google\\.com\\//.test(u)){ msg.textContent = \"Apps Script の URL を 入れてください\"; return; }\n    try{ localStorage.setItem(KEY, u); }catch(e){}\n    document.getElementById(\"urlbox\").classList.add(\"hide\");\n    msg.textContent = \"\";\n    load();\n  };\n\n  function fsNow(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }\n  function post(m){ m.hs = \"launcher\"; m.fs = fsNow(); try{ (inner || frame.contentWindow).postMessage(m, \"*\"); }catch(e){} }\n  /* GAS の画面は iframe の中の、さらに奥の枠で動く。送り主が #app の中の枠かどうかを親をたどって確かめる */\n  function fromApp(w){\n    for(var i = 0; w && i < 6; i++){\n      if(w === frame.contentWindow) return true;\n      if(w === window || w === w.parent) return false;\n      w = w.parent;\n    }\n    return false;\n  }\n\n  function enter(){\n    var el = document.documentElement;\n    var f = el.requestFullscreen || el.webkitRequestFullscreen;\n    if(!f) return Promise.reject(new Error(\"この ブラウザでは 全画面に できません\"));\n    return Promise.resolve(f.call(el, {navigationUI:\"hide\"})).then(function(){\n      if(navigator.keyboard && navigator.keyboard.lock) return navigator.keyboard.lock().catch(function(){});\n    });\n  }\n\n  document.getElementById(\"go\").onclick = function(){\n    if(!frame.src){ msg.textContent = \"先に URL を 入れてください\"; return; }\n    exiting = false;\n    enter().then(function(){\n      start.classList.add(\"hide\");\n      msg.textContent = \"\";\n      post({ev: started ? \"resume\" : \"start\"});\n      started = true;\n    }, function(err){ msg.textContent = \"全画面に できませんでした：\" + (err && err.message || err); });\n  };\n\n  function onFs(){\n    if(fsNow()) return;\n    if(exiting){\n      exiting = false; started = false;\n      start.classList.remove(\"hide\");\n      msg.textContent = \"おわりました\";\n      post({ev:\"ended\"});\n      return;\n    }\n    if(started) post({ev:\"leave\"});\n  }\n  document.addEventListener(\"fullscreenchange\", onFs);\n  document.addEventListener(\"webkitfullscreenchange\", onFs);\n\n  window.addEventListener(\"message\", function(e){\n    if(!e.data || !fromApp(e.source)) return;\n    var d = e.data;\n    if(/^(hello|enter|exit)$/.test(d.hs)) inner = e.source;\n    if(d.hs === \"hello\") post({ev:\"hello\"});\n    else if(d.hs === \"enter\"){\n      exiting = false;\n      enter().then(function(){\n        start.classList.add(\"hide\");\n        post({ev: started ? \"resume\" : \"start\"});\n        started = true;\n      }, function(){ post({ev:\"fsfail\"}); });\n    }\n    else if(d.hs === \"exit\"){\n      exiting = true;\n      if(fsNow()){\n        var f = document.exitFullscreen || document.webkitExitFullscreen;\n        try{ f.call(document); }catch(err){ onFs(); }\n      }else onFs();\n    }\n  });\n\n  document.addEventListener(\"contextmenu\", function(e){ e.preventDefault(); });\n  window.addEventListener(\"beforeunload\", function(e){ if(started){ e.preventDe   bed:    '<path d="M3 18V6M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="2"/>',
  minus:  '<path d="M6 12h12"/>',
  paste:  '<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6"/>',
  clock:  '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'

var ICON_LABEL = {book:"本", calc:"計算", note:"連絡帳", pencil:"えんぴつ", paper:"プリント",
                  star:"星", music:"音楽", bag:"かばん", abc:"英語"};
function icon(name, cls){
  var p = ICON_PATHS[name] || ICON_PATHS.paper;
  return '<svg class="ic' + (cls ? " " + cls : "") + '" viewBox="0 0 24 24" aria-hidden="true" '
       + 'fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">'
       + p + '</svg>';

/* 共通の道具：サーバ呼び出し・文字の逃がし・音・トースト・暗証番号の token */

function call(name){
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function(resolve, reject){
    var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
    r[name].apply(r, args);
  });
}
function isLocked(err){ return /LOCKED/.test(String(err && err.message || err)); }
function errText(err){
  var m = String(err && err.message || err || "");
  if(/LOCKED/.test(m)) return "もう一度、暗証番号を入れてください。";
  if(/network|NetworkError|Failed to fetch|通信/i.test(m)) return "つながりませんでした。少しして、もう一度ためしてください。";
  return m.replace(/^Error:\s*/, "").slice(0, 120) || "うまくいきませんでした。";
}

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[c];
  });
}
function $(sel, root){ return (root || document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

function dateLabel(date, wd){
  var p = String(date).split("-");
  return Number(p[1]) + "月" + Number(p[2]) + "日（" + (wd || Domain.weekday(date)) + "）";
}

/* 短い音。出した＝高い音1回、とりけし＝低い音、押せない＝低い音2回 */
var Sound = (function(){
  var ctx = null;
  function beep(freq, ms, when){
    try{
      if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      var t = ctx.currentTime + (when || 0);
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + ms / 1000);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + ms / 1000 + 0.02);
    }catch(e){}
  }
  return {
    ok: function(){ beep(1175, 120); },
    tick: function(){ beep(784, 90); },
    undo: function(){ beep(523, 160); },
    no: function(){ beep(330, 110); beep(330, 110, 0.16); }
  };
})();

function toast(msg, ng){
  var old = $(".toast"); if(old) old.remove();
  var t = document.createElement("div");
  t.className = "toast" + (ng ? " ng" : "");
  t.setAttribute("role", "status");
  t.innerHTML = icon(ng ? "alert" : "check") + "<span>" + esc(msg) + "</span>";
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, ng ? 5000 : 2200);
}

var Token = {
  KEY: "homework-scan/token",
  get: function(){ try{ return sessionStorage.getItem(this.KEY) || ""; }catch(e){ return this._m || ""; } },
  set: function(t){ this._m = t; try{ sessionStorage.setItem(this.KEY, t); }catch(e){} },
  clear: function(){
    var t = this.get();
    this._m = ""; try{ sessionStorage.removeItem(this.KEY); }catch(e){}
    if(t) call("apiLock", t).catch(function(){});
  }
};
/* 暗証番号の入力。画面の数字ボタンでも、キーボードの数字でも入れられる。
   askPin() は token を返す（やめたら null）。まだ決めていなければ、決める手順になる。 */
function askPin(opts){
  opts = opts || {};
  return new Promise(function(resolve){
    var mode = "enter", first = "", val = "";
    var wrap = document.createElement("div");
    wrap.className = "dlg";
    wrap.setAttribute("role", "dialog");
    wrap.setAttribute("aria-modal", "true");
    wrap.innerHTML =
        '<div class="box">'
      +   '<h2 class="ptitle"></h2>'
      +   '<div class="pinshow" aria-hidden="true"></div>'
      +   '<div class="pinmsg" aria-live="polite"></div>'
      +   '<div class="keys">'
      +     [1,2,3,4,5,6,7,8,9].map(function(n){ return '<button class="key" data-k="' + n + '">' + n + '</button>'; }).join("")
      +     '<button class="key" data-k="del" aria-label="1文字けす">' + icon("undo") + '</button>'
      +     '<button class="key" data-k="0">0</button>'
      +     '<button class="key" data-k="ok" aria-label="決定">' + icon("check") + '</button>'
      +   '</div>'
      +   '<div class="acts"><button class="btn" data-k="cancel">' + icon("close") + (opts.cancelLabel || "やめる") + '</button></div>'
      + '</div>';
    document.body.appendChild(wrap);
    var title = $(".ptitle", wrap), show = $(".pinshow", wrap), msg = $(".pinmsg", wrap);

    function setMode(m, text, ng){
      mode = m; val = "";
      title.innerHTML = icon(m === "enter" ? "lock" : "shield") + " " + esc(
        m === "enter" ? "先生の暗証番号" : m === "new1" ? "暗証番号を決めてください（4〜8けた）" : "もう一度、同じ番号を");
      note(text || "", ng);
      draw();
    }
    function note(text, ng){ msg.textContent = text; msg.className = "pinmsg" + (ng ? " ng" : ""); }
    function draw(){
      var n = Math.max(4, val.length), h = "";
      for(var i = 0; i < n; i++) h += '<i class="' + (i < val.length ? "f" : "") + '"></i>';
      show.innerHTML = h;
    }
    function close(tok){
      document.removeEventListener("keydown", onKey, true);
      wrap.remove();
      resolve(tok || null);
    }
    function submit(){
      if(val.length < 4){ note("4けた以上 入れてください", true); Sound.no(); return; }
      if(mode === "new1"){ first = val; setMode("new2"); return; }
      if(mode === "new2"){
        if(val !== first){ setMode("new1", "2回の番号がちがいました。はじめから", true); Sound.no(); return; }
        note("決めています…");
        call("apiSetPin", Token.get(), val).then(function(r){ Token.set(r.token); close(r.token); })
          .catch(function(e){ setMode("new1", errText(e), true); });
        return;
      }
      var tried = val;
      note("たしかめています…"); val = ""; draw();
      call("apiUnlock", tried).then(function(r){
        if(r.ok){ Token.set(r.token); close(r.token); return; }
        if(r.needSetup){ setMode("new1", "まだ暗証番号がありません。決めてください"); return; }
        Sound.no();
        if(r.wait) note("まちがいが続いたので、5分まってください", true);
        else note("ちがいます（あと " + r.left + " 回）", true);
      }).catch(function(e){ note(errText(e), true); });
    }
    function press(k){
      if(k === "cancel") return close(null);
      if(k === "del"){ val = val.slice(0, -1); draw(); return; }
      if(k === "ok") return submit();
      if(/^\d$/.test(k) && val.length < 8){ val += k; draw(); }
    }
    function onKey(e){
      var k = e.key;
      if(/^\d$/.test(k)) press(k);
      else if(k === "Backspace") press("del");
      else if(k === "Enter") press("ok");
      else if(k === "Escape") press("cancel");
      else return;
      e.preventDefault(); e.stopPropagation();
    }
    wrap.addEventListener("click", function(e){
      var b = e.target.closest("[data-k]");
      if(b) press(b.getAttribute("data-k"));
    });
    document.addEventListener("keydown", onKey, true);
    setMode(opts.setup ? "new1" : "enter");
  });
}
/* ==================================================================
   係の画面。当日の「だれが・何を出したか」の表だけを出す。

   ■ 左右2分割：左に 1〜18 番、右に 19 番から
   ■ マスをタップするたびに  空白 → ○ → 休 → 忘 → △ → 空白
   ■ 免除のマスは ○ と同じ見た目（理由は係に見せない）。タップしても変わらない
   ■ タップした記録は、まずこの端末に貯めてからサーバへ送る。
     つながらなくても印は消えず、つながったときにまとめて送る。
================================================================== */
var MARK = {
  on:     {ch:"○", label:"出した"},
  rest:   {ch:"休", label:"休み"},
  forgot: {ch:"忘", label:"わすれた"},
  doing:  {ch:"△", label:"やっている"},
  "":     {ch:"",  label:"まだ"}
};
/* ○ と △ は字だと線が細いので、太い線の図形で描く */
var MARK_SVG = {
  on:    '<svg class="gm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="3.4"/></svg>',
  doing: '<svg class="gm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6L21 19.6H3z" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/></svg>'
};
function markGlyph(s){ return MARK_SVG[s] || esc(MARK[s || ""].ch); }

var Helper = (function(){
  var SPLIT = 18;
  var QKEY = "homework-scan/queue-v1", DKEY = "homework-scan/device";
  var S = null;          /* サーバから来た当日の状態 */
  var queue = loadQueue();
  var online = true, busy = false, reqNo = 0, applied = 0, timer = null, backoff = 0;
  var root = null, active = false, n = 0;

  function device(){
    try{
      var d = localStorage.getItem(DKEY);
      if(!d){ d = Math.random().toString(36).slice(2, 8); localStorage.setItem(DKEY, d); }
      return d;
    }catch(e){ return "nolocal"; }
  }
  function loadQueue(){ try{ return JSON.parse(localStorage.getItem(QKEY) || "[]"); }catch(e){ return []; } }
  function saveQueue(){ try{ localStorage.setItem(QKEY, JSON.stringify(queue)); }catch(e){} }

  /* サーバの状態に、まだ送っていない分を重ねたもの */
  function view(){
    var cells = {};
    Object.keys(S.cells).forEach(function(k){ cells[k] = S.cells[k]; });
    queue.forEach(function(e){
      if(e.date !== S.date) return;
      var k = e.no + ":" + e.slot;
      if(e.op === "off") delete cells[k]; else cells[k] = e.op;
    });
    return cells;
  }

  /* 返ってきた順ではなく、頼んだ順で新しいものだけを使う */
  function request(name, args){
    var my = ++reqNo;
    return call.apply(null, [name].concat(args || [])).then(function(r){
      online = true; backoff = 0;
      var st = r && r.state ? r.state : r;
      if(r && r.processed){
        var p = {}; r.processed.forEach(function(id){ p[id] = true; });
        queue = queue.filter(function(e){ return !p[e.id]; });
        saveQueue();
      }
      if(my > applied){ applied = my; S = st; }
      render();
      return r;
    }, function(err){
      online = false;
      backoff = Math.min(30000, backoff ? backoff * 2 : 4000);
      render();
      throw err;
    });
  }

  function sync(){
    if(busy) return Promise.resolve();
    busy = true;
    var p = queue.length ? request("apiMark", [queue.slice(0, 200)]) : request("apiToday");
    return p.then(function(){ busy = false; if(queue.length) return sync(); },
                  function(){ busy = false; });
  }
  function schedule(){
    clearTimeout(timer);
    if(!active) return;
    timer = setTimeout(function(){ sync().then(schedule, schedule); }, backoff || (queue.length ? 1500 : 15000));
  }
  function kick(){ sync().then(schedule, schedule); }

  function mark(no, slot, state){
    queue.push({id: device() + "-" + Date.now().toString(36) + "-" + (++n), date:S.date, no:no, slot:slot,
                op: state || "off", at:Date.now(), via:"tap", dev:device()});
    saveQueue();
    paintCell(no + ":" + slot, state);
    paintSummary();
    kick();
  }

  function onTap(e){
    var c = e.target.closest(".cell[data-k]");
    if(!c) return;
    var k = c.getAttribute("data-k"), p = k.split(":");
    if(S.excused[k]){ Sound.no(); flash(c); return; }
    var next = Domain.nextState(view()[k] || "");
    if(next === "on") Sound.ok(); else if(next === "") Sound.undo(); else Sound.tick();
    mark(Number(p[0]), Number(p[1]), next);
  }

  function cellInner(state){
    return '<span class="g" aria-hidden="true">' + markGlyph(state) + '</span>';
  }
  function cellHtml(no, it, state, excused){
    var s = excused ? "on" : (state || "");
    return '<button class="cell s-' + (s || "none") + '" data-k="' + no + ':' + it.slot + '" '
         + 'aria-label="' + no + 'ばん ' + esc(it.name) + ' ' + MARK[s].label + '">' + cellInner(s) + '</button>';
  }
  function paintCell(k, state){
    var c = root && root.querySelector('.cell[data-k="' + k + '"]');
    if(!c) return render();
    var p = k.split(":"), it = itemOf(Number(p[1]));
    var s = state || "";
    c.className = "cell s-" + (s || "none");
    c.setAttribute("aria-label", p[0] + "ばん " + it.name + " " + MARK[s].label);
    c.innerHTML = cellInner(s);
    flash(c);
  }
  function flash(c){ c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash"); }

  function itemOf(slot){ return S.items.filter(function(i){ return i.slot === slot; })[0]; }

  function summaryHtml(){
    var cells = view();
    return S.items.map(function(it){
      var left = 0, forgot = 0, doing = 0;
      S.roster.forEach(function(r){
        var k = r.no + ":" + it.slot;
        if(S.excused[k]) return;
        if(!cells[k]) left++;
        else if(cells[k] === "forgot") forgot++;
        else if(cells[k] === "doing") doing++;
      });
      var f = (forgot ? '<span class="fg">忘 ' + forgot + '</span>' : '')
            + (doing ? '<span class="dg">' + MARK_SVG.doing + doing + '</span>' : '');
      return left
        ? '<div class="chip">' + icon(it.icon) + esc(it.name) + '<span class="left">まだ ' + left + '人</span>' + f + '</div>'
        : '<div class="chip all">' + icon(it.icon) + esc(it.name) + icon("check") + 'ぜんいん チェック' + f + '</div>';
    }).join("");
  }
  function paintSummary(){ var s = root && root.querySelector(".sum"); if(s) s.innerHTML = summaryHtml(); }

  function paneHtml(list, rows, cols, cells, named){
    var h = '<div class="pane" style="--cols:' + cols + ';grid-template-rows:auto repeat(' + rows + ',1fr)">';
    h += '<div class="row head"><div>' + (named ? 'ばん・なまえ' : 'ばん') + '</div>'
       + S.items.map(function(it){ return '<div>' + icon(it.icon) + '<span>' + esc(it.name) + '</span></div>'; }).join("")
       + '</div>';
    for(var i = 0; i < rows; i++){
      var st = list[i];
      if(!st){
        h += '<div class="row empty"><div class="who"></div>'
           + S.items.map(function(){ return '<div class="cell"></div>'; }).join("") + '</div>';
        continue;
      }
      h += '<div class="row"><div class="who"><span class="no">' + st.no + '</span>'
         + (st.name ? '<span class="nm">' + esc(st.name) + '</span>' : '') + '</div>'
         + S.items.map(function(it){
             var k = st.no + ":" + it.slot;
             return cellHtml(st.no, it, cells[k], !!S.excused[k]);
           }).join("") + '</div>';
    }
    return h + '</div>';
  }

  function legend(){
    return '<div class="legend" aria-hidden="true">タップで かわる：'
      + ["", "on", "rest", "forgot", "doing", ""].map(function(s){
          return '<span class="lg s-' + (s || "none") + '">' + (markGlyph(s) || "　") + '</span>';
        }).join('<span class="arr">→</span>') + '</div>';
  }

  function render(){
    if(!root || !active) return;
    if(!S){ root.innerHTML = '<div class="helper"><div class="none">' + icon("sync") + 'よみこみ中…</div></div>'; return; }
    var cells = view();
    var net = online
      ? '<div class="net" title="保存できています">' + icon("cloud") + '<span class="sr">保存できています</span></div>'
      : '<div class="net off" role="status">' + icon("cloudOff") + 'つながっていません（しるしは この PC に のこっています）</div>';
    var head = '<div class="hbar"><div class="date">' + esc(dateLabel(S.date, S.wd)) + '</div>'
      + '<div class="title">' + icon("check") + 'しゅくだい チェック</div><div class="grow"></div>' + net
      + '<button class="btn tbtn" data-act="teacher">' + icon("lock") + '先生</button></div>';

    var body;
    if(!S.roster.length){
      body = '<div class="none">' + icon("users") + '名簿が まだ ありません<p>先生の画面で 名簿を 入れてください</p></div>';
    }else if(!S.items.length){
      body = '<div class="none">' + icon("star") + 'きょうは 提出物が ありません</div>';
    }else{
      var L = S.roster.filter(function(r){ return r.no <= SPLIT; });
      var R = S.roster.filter(function(r){ return r.no > SPLIT; });
      var rows = Math.max(SPLIT, L.length, R.length);
      var named = S.roster.some(function(r){ return r.name; });
      var cols = (named ? "minmax(0,2.2fr)" : "minmax(0,.8fr)") + " repeat(" + S.items.length + ",minmax(0,1fr))";
      body = '<div class="sumbar"><div class="sum">' + summaryHtml() + '</div>' + legend() + '</div>'
           + '<div class="panes">' + paneHtml(L, rows, cols, cells, named) + paneHtml(R, rows, cols, cells, named) + '</div>';
    }
    root.innerHTML = '<div class="helper">' + head + body + '</div>';
  }

  function mount(el){ root = el; active = true; render(); kick(); }
  function unmount(){ active = false; clearTimeout(timer); }

  document.addEventListener("click", function(e){
    if(!active || !root || !root.contains(e.target)) return;
    if(e.target.closest("[data-act=teacher]")){ Guard.teacherMenu(); return; }
    onTap(e);
  });
  document.addEventListener("visibilitychange", function(){ if(active && !document.hidden) kick(); });
  window.addEventListener("online", function(){ if(active) kick(); });

  return {mount:mount, unmount:unmount, refresh:kick, pending:function(){ return queue.length; }};
})();
/* ==================================================================
   先生の画面。暗証番号で得た token がある間だけ開く。
     きょうの表 … その日の提出物を決める・欠席・マスを直す（前の7日まで）
     分析       … 提出率・平均提出時刻・続けて出ていない日数
     免除       … 特別な事情のある子を、期間・品目ごとに外す
     名簿と品目 … 名簿の貼り付け、品目の枠（名前・アイコン・いつも出す）
     せってい   … 分析の目安、係の画面の氏名、暗証番号、起動用ファイル、操作記録
================================================================== */
var Teacher = (function(){
  var root = null, opts = {}, tab = "day", active = false;
  var D = null, SU = null, ST = null, date = "", sortBy = "no", roster = null, logs = null;
  var TABS = [["day", "calendar", "きょうの表"], ["stats", "chart", "分析"], ["exempt", "shield", "免除"],
              ["roster", "users", "名簿と品目"], ["settings", "gear", "せってい"]];

  /* token が切れていたら暗証番号を聞き直して、1回だけやり直す */
  function tcall(name){
    return retry(name, [Token.get].concat(Array.prototype.slice.call(arguments, 1)));
  }
  /* args の中の Token.get は、呼ぶたびにいまの token に置き換える */
  function retry(name, args){
    function go(){
      return call.apply(null, [name].concat(args.map(function(a){ return a === Token.get ? Token.get() : a; })));
    }
    return go().catch(function(err){
      if(!isLocked(err)) throw err;
      return askPin({cancelLabel:"とじる"}).then(function(tok){
        if(!tok){ back(); throw new Error("LOCKED"); }
        return go();
      });
    }).catch(function(err){
      if(!isLocked(err)) toast(errText(err), true);
      throw err;
    });
  }

  function back(){ if(opts.back) opts.back(); }

  function frame(body){
    var t = TABS.map(function(x){
      return '<button class="tab" role="tab" data-tab="' + x[0] + '" aria-selected="' + (tab === x[0]) + '">'
           + icon(x[1]) + x[2] + '</button>';
    }).join("");
    root.innerHTML = '<div class="teacher">'
      + '<div class="tbar"><h1>' + icon("unlock") + '先生の画面</h1><div class="grow"></div>'
      + '<button class="btn" data-t="back">' + icon(opts.page ? "lock" : "back") + esc(opts.backLabel || "もどる") + '</button></div>'
      + '<div class="tabs" role="tablist">' + t + '</div>'
      + '<div class="tbody">' + body + '</div></div>';
  }
  function loading(){ frame('<div class="empty-msg">' + icon("sync") + ' よみこみ中…</div>'); }

  function show(){
    if(!active) return;
    if(tab === "day") return D ? frame(dayHtml()) : loadDay(date);
    if(tab === "stats") return ST ? frame(statsHtml()) : loadStats();
    if(!SU) return loadSetup();
    if(tab === "exempt") return frame(exemptHtml());
    if(tab === "roster") return frame(rosterHtml());
    if(tab === "settings") return frame(settingsHtml());
  }
  function loadDay(d){
    loading();
    return tcall("apiTeacherDay", d || "").then(function(r){ D = r; date = r.date; show(); });
  }
  function loadSetup(){
    loading();
    return tcall("apiSetup").then(function(r){ SU = r; roster = null; show(); });
  }
  function loadStats(from, to){
    loading();
    return tcall("apiStats", from || "", to || "").then(function(r){ ST = r; show(); });
  }

  /* ────────── きょうの表 ────────── */
  function dayHtml(){
    var onDay = {};
    D.items.forEach(function(it){ onDay[it.slot] = it.name; });
