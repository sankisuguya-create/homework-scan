<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宿題チェック（起動用）</title>
<!--
  教室の PC に保存して、Chrome か Edge で開く起動用ファイル。
  中に宿題チェックの画面（GAS）を入れ、このファイルが全画面とキーの横取りを受け持つ。
  ・全画面の間は Esc の短押し・Alt+Tab・Windows キーなどをブラウザに渡さない（Keyboard Lock）
  ・Esc の長押し（約2秒）だけはブラウザの決まりで止められない。外れたら、中の画面が表を隠して
    「先生を よんでね」にし、先生の暗証番号が入るまで戻らない
  ・「係の画面を おわる」は中の画面で先生の暗証番号を入れたあとだけ
-->
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:#000;
  font-family:"BIZ UDPGothic","BIZ UDゴシック","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
#start{position:fixed;inset:0;z-index:5;background:#fff;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:28px;text-align:center;padding:24px}
#start.hide{display:none}
h1{font-size:52px;margin:0}
p{font-size:24px;margin:0;max-width:36em}
button{font:inherit;cursor:pointer;border:3px solid #000;border-radius:10px;background:#0033A0;color:#fff;
  font-size:34px;font-weight:800;min-height:96px;padding:12px 48px}
button:focus-visible,input:focus-visible{outline:5px solid #FFC20E;outline-offset:2px}
.msg{font-size:26px;font-weight:800;background:#FFC20E;padding:6px 18px;border-radius:8px}
.msg:empty{display:none}
.url{display:flex;flex-direction:column;gap:10px;align-items:center;font-size:20px;font-weight:700}
.url input{width:min(90vw,760px);font-size:18px;padding:10px;border:2px solid #000;border-radius:8px}
.url button{font-size:22px;min-height:60px;padding:6px 24px;background:#fff;color:#000}
.url.hide{display:none}
</style>
</head>
<body>
<div id="start">
  <h1>しゅくだい チェック</h1>
  <div class="msg" id="msg"></div>
  <button id="go">はじめる</button>
  <p>全画面に なります。おわるときは、画面の「先生」から 先生が 暗証番号を 入れます。</p>
  <div class="url hide" id="urlbox">
    <label for="url">宿題チェックの URL（Apps Script の「ウェブアプリ」の URL）</label>
    <input id="url" type="url" placeholder="https://script.google.com/a/macros/…/exec">
    <button id="seturl">この URL を 使う</button>
  </div>
</div>
<iframe id="app" title="宿題チェック" allow="autoplay"></iframe>
<script>
(function(){
  var URL_IN_FILE = "__APP_URL__";
  var KEY = "homework-scan/launcher-url";
  var frame = document.getElementById("app"), start = document.getElementById("start");
  var msg = document.getElementById("msg");
  var started = false, exiting = false, inner = null;

  function appUrl(){
    if(/^https?:|^file:/.test(URL_IN_FILE)) return URL_IN_FILE;
    try{ return localStorage.getItem(KEY) || ""; }catch(e){ return ""; }
  }
  function load(){
    var u = appUrl();
    if(!u){ document.getElementById("urlbox").classList.remove("hide"); return; }
    frame.src = u;
  }
  document.getElementById("seturl").onclick = function(){
    var u = document.getElementById("url").value.trim();
    if(!/^https:\/\/script\.google\.com\//.test(u)){ msg.textContent = "Apps Script の URL を 入れてください"; return; }
    try{ localStorage.setItem(KEY, u); }catch(e){}
    document.getElementById("urlbox").classList.add("hide");
    msg.textContent = "";
    load();
  };

  function fsNow(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function post(m){ m.hs = "launcher"; m.fs = fsNow(); try{ (inner || frame.contentWindow).postMessage(m, "*"); }catch(e){} }
  /* GAS の画面は iframe の中の、さらに奥の枠で動く。送り主が #app の中の枠かどうかを親をたどって確かめる */
  function fromApp(w){
    for(var i = 0; w && i < 6; i++){
      if(w === frame.contentWindow) return true;
      if(w === window || w === w.parent) return false;
      w = w.parent;
    }
    return false;
  }

  function enter(){
    var el = document.documentElement;
    var f = el.requestFullscreen || el.webkitRequestFullscreen;
    if(!f) return Promise.reject(new Error("この ブラウザでは 全画面に できません"));
    return Promise.resolve(f.call(el, {navigationUI:"hide"})).then(function(){
      if(navigator.keyboard && navigator.keyboard.lock) return navigator.keyboard.lock().catch(function(){});
    });
  }

  document.getElementById("go").onclick = function(){
    if(!frame.src){ msg.textContent = "先に URL を 入れてください"; return; }
    exiting = false;
    enter().then(function(){
      start.classList.add("hide");
      msg.textContent = "";
      post({ev: started ? "resume" : "start"});
      started = true;
    }, function(err){ msg.textContent = "全画面に できませんでした：" + (err && err.message || err); });
  };

  function onFs(){
    if(fsNow()) return;
    if(exiting){
      exiting = false; started = false;
      start.classList.remove("hide");
      msg.textContent = "おわりました";
      post({ev:"ended"});
      return;
    }
    if(started) post({ev:"leave"});
  }
  document.addEventListener("fullscreenchange", onFs);
  document.addEventListener("webkitfullscreenchange", onFs);

  window.addEventListener("message", function(e){
    if(!e.data || !fromApp(e.source)) return;
    var d = e.data;
    if(/^(hello|enter|exit)$/.test(d.hs)) inner = e.source;
    if(d.hs === "hello") post({ev:"hello"});
    else if(d.hs === "enter"){
      exiting = false;
      enter().then(function(){
        start.classList.add("hide");
        post({ev: started ? "resume" : "start"});
        started = true;
      }, function(){ post({ev:"fsfail"}); });
    }
    else if(d.hs === "exit"){
      exiting = true;
      if(fsNow()){
        var f = document.exitFullscreen || document.webkitExitFullscreen;
        try{ f.call(document); }catch(err){ onFs(); }
      }else onFs();
    }
  });

  document.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  window.addEventListener("beforeunload", function(e){ if(started){ e.preventDefault(); e.returnValue = ""; } });

  load();
})();
</script>
</body>
</html>
