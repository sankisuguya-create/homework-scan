name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 生成物が src と一致しているか
        run: python3 build.py --check
      - name: 構文
        run: |
          for f in src/js/*.js; do node --check "$f"; done
          for f in gas/*.gs; do cp "$f" /tmp/check.js && node --check /tmp/check.js; done
      - name: サーバ側の決まり
        run: node tests/server.test.js
